# ============================================================================
#  fuzzel — fast, tiny app launcher & dmenu (graphite & gold)
# ============================================================================

[main]
font = Inter:size=13
prompt = ❯
icon-theme = Adwaita
icons-enabled = yes
lines = 9
columns = 1
width = 40
horizontal-pad = 18
inner-pad = 12
line-height = 26
letter-spacing = 0
layer = overlay
exit-on-keyboard-focus-loss = yes
terminal = kitty

[border]
width = 1
radius = 14

[colors]
background = 121417f5
text = e6e9efff
match = e6b450ff
selection = 262b34ff
selection-text = e6e9efff
selection-match = e6b450ff
border = e6b45040

[key-bindings]
cancel = Control+g Escape
