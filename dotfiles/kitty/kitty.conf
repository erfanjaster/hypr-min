# ============================================================================
#  kitty — graphite & gold terminal. Opaque on purpose: fastest rendering,
#  no blur compositing. Colors match the rest of the desktop.
# ============================================================================

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        11.5

cursor_shape     beam
cursor_blink_interval 0
hide_window_decorations yes
confirm_os_window_close 0
enable_audio_bell no
# 4k lines is plenty to scroll back and keeps each window's buffer small;
# raise it if you regularly need more history.
scrollback_lines 4000
window_padding_width 10
placement_strategy center
tab_bar_style fade
shell_integration enabled
strip_trailing_spaces smart
sync_to_monitor yes

# ---- palette ----
background   #121417
foreground   #dfe4ec
cursor       #e6b450
selection_background #2a2f38
selection_foreground #dfe4ec

color0  #3a4048
color8  #565e6a
color1  #d77a61
color9  #e39a83
color2  #a3b18a
color10 #b9c6a2
color3  #e6b450
color11 #f0c674
color4  #82a4c6
color12 #a2c0dc
color5  #b99cc8
color13 #cdb4d8
color6  #8fb8b0
color14 #aad0c7
color7  #c9d0db
