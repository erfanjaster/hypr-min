# ============================================================================
#  hypridle — lock after 5 min idle, screen off 1 min later.
#  Suspend is intentionally disabled (commented): a working machine that
#  downloads/builds overnight should not sleep on its own. Enable the last
#  listener if you want auto-suspend after 30 min.
# ============================================================================

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# dim nothing, just lock the session after 5 minutes of idle
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# screen off one minute after locking; wakes instantly on any input
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# optional: suspend after 30 min idle (uncomment to enable)
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
