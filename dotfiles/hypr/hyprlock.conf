# ============================================================================
#  hyprlock — minimal graphite & gold lock screen
#  Instant render, solid background: locks fast even on weak GPUs.
# ============================================================================

general {
    hide_cursor = true
    immediate_render = true   # draw widgets instantly on solid background
}

background {
    monitor =
    color = rgba(0E1116FF)
}

# big gold clock
label {
    monitor =
    text = cmd[update:30000] date +"%H:%M"
    color = rgba(E6B450FF)
    font_family = Inter
    font_size = 92
    position = 0, -60
    halign = center
    valign = center
}

# weekday + date under the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(8B93A1FF)
    font_family = Inter
    font_size = 17
    position = 0, 12
    halign = center
    valign = center
}

# who is locked
label {
    monitor =
    text = $USER
    color = rgba(E6E9EFFF)
    font_family = Inter
    font_size = 15
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    position = 0, 120
    halign = center
    valign = center

    outline_thickness = 2
    rounding = -1                      # pill shape
    outer_color = rgba(E6B45066)
    inner_color = rgba(1A1D23FF)
    font_color = rgba(E6E9EFFF)
    font_family = Inter

    dots_size = 0.28
    dots_spacing = 0.25
    dots_center = true

    fade_on_empty = false
    placeholder_text = <i>password…</i>

    check_color = rgba(E6B450FF)
    check_text = verifying…
    fail_color = rgba(D77A61FF)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
}
