9:24</text><rect x="1312" y="8" width="66" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1324,15)" color="#E6E9EF"><use href="#i-batt"/></g><text x="1350" y="29" fill="#E6E9EF" font-size="14">87%</text></g>
  
  <text x="40" y="498" fill="#8B93A1" font-size="13" letter-spacing="0.6">SUPER+/ — the live cheat sheet, read straight from `hyprctl binds -j` (so it can never drift)</text>
