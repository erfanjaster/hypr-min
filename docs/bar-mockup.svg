  <text x="40" y="52" fill="#E6E9EF" font-size="25" font-weight="700">hypr-min &#10022; waybar &#8220;Graphite &amp; Gold&#8221;</text>
  <text x="40" y="78" fill="#8B93A1" font-size="14">a pill only appears when it has something to say &#8212; conditional modules hide themselves completely</text>
  <text x="40" y="136" fill="#8B93A1" font-size="13" letter-spacing="0.6">1 · QUIET DESKTOP — four pills, nothing else (mpris, submap, updates, idle-inhibit are hidden)</text><g transform="translate(40,150)"><rect width="1520" height="46" rx="16" fill="#1A1D23" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.06"/><rect x="10" y="8" width="30" height="30" rx="15" fill="#E6B450"/><text x="25" y="29" fill="#14161A" font-size="15" font-weight="700" text-anchor="middle">1</text><text x="53" y="29" fill="#8B93A1" font-size="15" text-anchor="middle">2</text><text x="81" y="29" fill="#8B93A1" font-size="15" text-anchor="middle">3</text><text x="109" y="29" fill="#8B93A1" font-size="15" text-anchor="middle">4</text><text x="134" y="30" fill="#C7CDD8" font-size="15">hyprland.lua — kitty</text><rect x="1450" y="8" width="60" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1462,15)" color="#E6B450"><use href="#i-keys"/></g><g transform="translate(1488,15)" color="#E6B450"><use href="#i-pwr"/></g><rect x="1386" y="8" width="56" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><text x="1398" y="29" fill="#E6E9EF" font-size="14">19:24</text><rect x="1260" y="8" width="118" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1272,15)" color="#E6E9EF"><use href="#i-wifi"/></g><g transform="translate(1298,15)" color="#E6E9EF"><use href="#i-vol"/></g><text x="1324" y="29" fill="#E6E9EF" font-size="14">42%</text><g transform="translate(1356.36,15)" color="#E6E9EF"><use href="#i-sun"/></g><rect x="1078" y="8" width="174" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1090,15)" color="#E6E9EF"><use href="#i-cpu"/></g><text x="1116" y="29" fill="#E6E9EF" font-size="14">7%</text><g transform="translate(1140.24,15)" color="#E6E9EF"><use href="#i-ram"/></g><text x="1166.24" y="29" fill="#E6E9EF" font-size="14">38%</text><g transform="translate(1198.6,15)" color="#E6E9EF"><use href="#i-temp"/></g><text x="1224.6" y="29" fill="#E6E9EF" font-size="14">52°</text></g><text x="40" y="272" fill="#8B93A1" font-size="13" letter-spacing="0.6">2 · LAPTOP — media, 3 pending updates, idle frozen, CPU above the warning threshold</text><g transform="translate(40,286)"><rect width="1520" height="46" rx="16" fill="#1A1D23" fill-opacity="0.93" stroke="#FFFFFF" stroke-opacity="0.06"/><text x="25" y="29" fill="#8B93A1" font-size="15" text-anchor="middle">1</text><rect x="38" y="8" width="30" height="30" rx="15" fill="#E6B450"/><text x="53" y="29" fill="#14161A" font-size="15" font-weight="700" text-anchor="middle">2</text><text x="81" y="29" fill="#8B93A1" font-size="15" text-anchor="middle">3</text><text x="106" y="30" fill="#C7CDD8" font-size="15">Mozilla Firefox</text><rect x="670" y="8" width="180" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(682,15)" color="#E6E9EF"><use href="#i-note"/></g><text x="708" y="29" fill="#E6E9EF" font-size="14">Time — Pink Floyd</text><rect x="1450" y="8" width="60" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1462,15)" color="#E6B450"><use href="#i-keys"/></g><g transform="translate(1488,15)" color="#E6B450"><use href="#i-pwr"/></g><rect x="1386" y="8" width="56" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><text x="1398" y="29" fill="#E6E9EF" font-size="14">19:24</text><rect x="1312" y="8" width="66" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1324,15)" color="#E6E9EF"><use href="#i-batt"/></g><text x="1350" y="29" fill="#E6E9EF" font-size="14">87%</text><rect x="1280" y="8" width="24" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1292,15)" color="#E6B450"><use href="#i-eye"/></g><rect x="1222" y="8" width="50" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.055"/><g transform="translate(1234,15)" color="#E6B450"><use href="#i-upd"/></g><text x="1260" y="29" fill="#E6B45