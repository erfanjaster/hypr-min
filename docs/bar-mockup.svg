      <text x="34" y="90" fill="#E6E9EF">SUPER+T</text><text x="220" y="90" fill="#E6E9EF">Tools menu (submap)</text>
      <text x="34" y="118" fill="#E6E9EF">SUPER+/</text><text x="220" y="118" fill="#E6E9EF">Keybind cheat sheet</text>
      <text x="34" y="146" fill="#E6B450">t</text><text x="220" y="146" fill="#E6E9EF">[tools] Terminal</text><text x="700" y="146" fill="#8B93A1">[tools]</text>
